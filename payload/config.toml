# User-facing policy for the Window Attention subsystem.
sound_enabled = true
sound_path = "~/.local/share/sounds/window-attention/soft-ui-pop.mp3"
sound_volume = 0.35
sound_cooldown_ms = 1500
history_enabled = true
# Supplement native urgency with standard D-Bus notifications, only when the
# authenticated sender PID owns exactly one compositor window.
desktop_notifications_enabled = true

# Optional local Agentd Hub subscription. Hub is a separate process and is
# intentionally disabled by default; it must be running before enabling this
# section. Yoohoo keeps its own acknowledgement ledger because the hub has no
# command API.
[agentd_hub]
enabled = false
url = "http://127.0.0.1:8787"
# machine = ""  # defaults to the local hostname
# How to reach a remote agent's tmux session: "auto", "et", "mosh", "ssh" or
# "local". auto uses et when this machine has the et client and the host's
# etserver was observed reachable (so the terminal's light/dark mode follows
# into remote apps), otherwise mosh, otherwise ssh. et and mosh fall back to
# ssh if they cannot start. What Yoohoo observed about each host is kept under
# ~/.local/state/window-attention/transport-capabilities/, never in this file.
transport = "auto"
